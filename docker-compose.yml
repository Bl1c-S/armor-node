services:
  psql:
    image: timescale/timescaledb:latest-pg18
    container_name: armor-psql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-armor-db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yourpassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d armor-db"]
      interval: 2s
      timeout: 2s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: API/Dockerfile
    container_name: armor-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Connection__PSQL=Host=psql;Port=5432;Database=${POSTGRES_DB:-armor-db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-yourpassword};
      - Auth__GoogleClientId=${GOOGLE_CLIENT_ID:-id.apps.googleusercontent.com}
      - Auth__GoogleClientSecret=${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      psql:
        condition: service_healthy
    volumes:
      - dp_keys:/home/app/.aspnet/DataProtection-Keys

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: armor-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_URL=http://api:8080
    depends_on:
      - api

volumes:
  pgdata:
  dp_keys:
